<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8769"/>
      <stop offset=".55" stop-color="#3e7b5c"/>
      <stop offset="1" stop-color="#346d50"/>
    </linearGradient>
  </defs>
  <!-- macOS-style tile: 824px square with a 100px margin; Sage Paper green -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="3"/>
  <!-- pointer: the click -->
  <path d="M330 262 L742 508 L562 552 L480 732 Z" fill="#ffffff" stroke="#ffffff" stroke-width="28" stroke-linejoin="round"/>
  <!-- orange dot: the one accent -->
  <circle cx="712" cy="712" r="92" fill="#e8833a" stroke="#ffffff" stroke-width="30"/>
</svg>
